<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <!-- Metallic gold ring gradient -->
    <linearGradient id="ring" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%"   stop-color="#FFE84A"/>
      <stop offset="20%"  stop-color="#F5B800"/>
      <stop offset="45%"  stop-color="#C07800"/>
      <stop offset="65%"  stop-color="#D49000"/>
      <stop offset="85%"  stop-color="#E8A800"/>
      <stop offset="100%" stop-color="#FFD840"/>
    </linearGradient>
    <!-- Star gradient -->
    <linearGradient id="sg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFF060"/>
      <stop offset="100%" stop-color="#C88800"/>
    </linearGradient>
    <!-- Figure warm brown -->
  </defs>

  <!-- ── Golden ring ── -->
  <circle cx="110" cy="115" r="96" fill="none" stroke="url(#ring)" stroke-width="13"/>

  <!-- ═══ THREE STARS ═══ -->
  <!-- Center top (largest, outer R=17 inner R=6.5) -->
  <polygon fill="url(#sg)"
    points="110,10 113.8,21.1 125.7,21.3 116.6,28.5 120.4,39.6 110,32.4 99.6,39.6 103.4,28.5 94.3,21.3 106.2,21.1"/>

  <!-- Left star (outer R=13 inner R=5) -->
  <polygon fill="url(#sg)"
    points="70,28 73,37.6 83,37.7 75.4,43.5 78.4,53.1 70,47.3 61.6,53.1 64.6,43.5 57,37.7 67,37.6"/>

  <!-- Right star (outer R=13) -->
  <polygon fill="url(#sg)"
    points="150,28 153,37.6 163,37.7 155.4,43.5 158.4,53.1 150,47.3 141.6,53.1 144.6,43.5 137,37.7 147,37.6"/>

  <!-- ═══ FIGURE (warm dark brown #2C1400) ═══ -->

  <!-- LEFT arm sweep: thick bezier from body-center outward+upward to ring -->
  <path d="M 105,170 C 88,154 56,124 18,84"
    fill="none" stroke="#2C1400" stroke-width="36" stroke-linecap="round"/>

  <!-- RIGHT arm sweep (mirror) -->
  <path d="M 115,170 C 132,154 164,124 202,84"
    fill="none" stroke="#2C1400" stroke-width="36" stroke-linecap="round"/>

  <!-- Body center connector + lower body (fills the V gap between arms) -->
  <path d="M 98,168 C 100,172 110,172 112,168 C 112,176 110,185 110,188 C 110,185 108,176 98,168 Z"
    fill="#2C1400"/>
  <ellipse cx="110" cy="168" rx="13" ry="10" fill="#2C1400"/>

  <!-- LEFT head -->
  <circle cx="86" cy="86" r="13" fill="#2C1400"/>
  <!-- RIGHT head -->
  <circle cx="132" cy="86" r="13" fill="#2C1400"/>
</svg>
