<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Ring gradient: bright gold top → deep amber bottom -->
    <linearGradient id="ring" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="35%"  stop-color="#F0A800"/>
      <stop offset="65%"  stop-color="#C87800"/>
      <stop offset="100%" stop-color="#FFD040"/>
    </linearGradient>
    <!-- Star gradient -->
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#D4960A"/>
    </linearGradient>
    <!-- Figure colour: warm chocolate brown -->
    <linearGradient id="fig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5A2D00"/>
      <stop offset="100%" stop-color="#3A1A00"/>
    </linearGradient>
  </defs>

  <!-- ── Outer golden ring (thick stroke, gap at bottom) ── -->
  <!-- Full ring but arms overlap at bottom, so just draw full circle -->
  <circle cx="100" cy="105" r="88" fill="none" stroke="url(#ring)" stroke-width="13"/>

  <!-- ── Stars ── -->
  <!-- Center top star (largest) -->
  <polygon
    points="100,12  105.9,29.3 124.1,29.3 109.9,39.7 115.8,57 100,46.6 84.2,57 90.1,39.7 75.9,29.3 94.1,29.3"
    fill="url(#star)"/>
  <!-- Left star -->
  <polygon
    points="62,24  66.6,38.2 81.5,38.2 69.8,46.4 74.4,60.6 62,52.4 49.6,60.6 54.2,46.4 42.5,38.2 57.4,38.2"
    fill="url(#star)"/>
  <!-- Right star -->
  <polygon
    points="138,24  142.6,38.2 157.5,38.2 145.8,46.4 150.4,60.6 138,52.4 125.6,60.6 130.2,46.4 118.5,38.2 133.4,38.2"
    fill="url(#star)"/>

  <!-- ── Two figures ── -->
  <!-- LEFT head -->
  <circle cx="80" cy="76" r="12" fill="url(#fig)"/>
  <!-- RIGHT head -->
  <circle cx="120" cy="76" r="12" fill="url(#fig)"/>

  <!-- LEFT arm sweeping up-left -->
  <path d="M 71,86 C 60,88 44,82 32,66"
        fill="none" stroke="url(#fig)" stroke-width="19" stroke-linecap="round"/>
  <!-- RIGHT arm sweeping up-right -->
  <path d="M 129,86 C 140,88 156,82 168,66"
        fill="none" stroke="url(#fig)" stroke-width="19" stroke-linecap="round"/>

  <!-- Shared torso + body -->
  <path d="
    M 68,88
    C 72,100 78,110 100,118
    C 122,110 128,100 132,88
    C 124,97 112,104 100,106
    C 88,104 76,97 68,88 Z"
    fill="url(#fig)"/>

  <!-- Lower body / legs spreading down -->
  <path d="
    M 100,116
    C 90,128 76,142 58,162
    L 74,162
    C 84,150 92,138 100,128
    C 108,138 116,150 126,162
    L 142,162
    C 124,142 110,128 100,116 Z"
    fill="url(#fig)"/>
</svg>
